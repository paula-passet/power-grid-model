# docs/automation.yml — last-match-wins mode rules
#
# Determines how the pipeline treats each docs file.
# Rules are evaluated in order; the LAST matching rule wins.
#
# Modes:
#   manual     — never touch (human-owned pages: index, api, contribution, algorithms)
#   edit       — patch on relevant changes (existing content-rich pages)
#   regenerate — always rebuild from scratch (requires a brief in pages.yml)

rules:
  # Default: all RST and Markdown files
  - pattern: "**/*.rst"
    mode: edit

  - pattern: "**/*.md"
    mode: edit

  # README is explicitly governed — change mode here to edit/regenerate/manual
  - pattern: "README.md"
    mode: edit

  # Notebooks are human-authored — never touch
  - pattern: "**/*.ipynb"
    mode: manual

  # API reference is generated from code (autodoc and Doxygen) — never touch
  - pattern: "docs/api_reference/**"
    mode: manual

  # Contribution section is human-owned — never touch
  - pattern: "docs/contribution/**"
    mode: manual

  # Algorithm pages contain derivations and equations — never touch
  - pattern: "docs/algorithms/**"
    mode: manual

  # Top-level index holds the install instructions and toctree — never touch
  - pattern: "docs/index.md"
    mode: manual



