# DRAFT docs/pages.yml for Power Grid Model (PGM)
#
# Catalog of pages the pipeline writes. Copy to docs/pages.yml in the PGM repo
# once reviewed. Only pages that are `edit` in automation.yml are listed:
# `manual` pages (algorithms, API reference, contribution, index, notebooks)
# never need a brief.
#
# Fields:
#   path        repo-relative path to the Markdown file
#   title       canonical page title, identical to the page's top-level heading
#   page_type   sub_page | standalone (default: sub_page)
#   purpose     what this page explains; passed to the LLM as the generation brief
#   diagrams    list of Mermaid diagram descriptions to generate (optional, unused here)

pages:
  # ── Repository README ──────────────────────────────────────────────────────

  - path: README.md
    title: Power Grid Model
    page_type: standalone
    purpose: >
      The front door of the project. Keep it short and scannable. Sections in
      order: (1) Title and status badges. (2) What power-grid-model is: a library
      for steady-state distribution power system analysis, distributed for Python
      and C, with a C++ core. List the supported calculations (power flow, state
      estimation, short circuit). (3) Links to the documentation and to the sibling
      repositories power-grid-model-io (data conversions) and power-grid-model-ds
      (extended Python interface), plus the mailing list note. (4) Installation:
      PyPI, Conda, and a link to the Build Guide for building from source.
      (5) Examples: link to the examples, do not copy them. (6) Licenses,
      Contributing, Citations and Contact. Design principle: link out to the
      documentation, do not duplicate content that lives there. The License,
      third-party licenses, Contributing, Citations and Contact sections are
      static boilerplate: keep them unchanged.

  # ── Getting started ────────────────────────────────────────────────────────

  - path: docs/quickstart.md
    title: Quick Start
    page_type: sub_page
    purpose: >
      A first working calculation in a few minutes. The page walks through one
      small 10 kV network: a line connects two nodes, one node has a source, the
      other has a symmetric load. Steps: input data, instantiating the model,
      running a power flow calculation, validating the data, and batch data. Keep
      the example complete and runnable against the current Python API. When the
      API changes, update only the affected code and its explanation. Link to the
      Graph Data Model, Calculations, Data Validator and Performance guide pages
      instead of repeating their content.

  # ── User manual ────────────────────────────────────────────────────────────

  - path: docs/user_manual/data-model.md
    title: Component Type Hierarchy and Graph Data Model
    page_type: sub_page
    purpose: >
      Explain how the library represents a grid as a graph data model. Cover the
      inheritance-like hierarchy of component types (a sub-type has all attributes
      of its parent), the hierarchy diagram, symmetry of components and
      calculations, and the reference direction convention. Keep the hierarchy
      diagram in sync with the component types that exist in the library. Link to
      the Components page for attribute details.

  - path: docs/user_manual/components.md
    title: Components
    page_type: sub_page
    purpose: >
      The reference for every component type and its attributes. Sections follow
      the hierarchy: base, node, branch (line, link, transformer, generic branch,
      asym line), branch3 (three-winding transformer), appliance (source, generic
      load and generator, shunt), sensor (voltage, power, current), fault and
      regulator (transformer tap regulator, voltage regulator). Each component
      lists its type name and its input and output attributes with type, unit and
      description, plus the equations that define derived values. Attribute names,
      types and units must match the library exactly. When a release adds or
      changes an attribute, edit only the affected component section and keep the
      existing structure and wording elsewhere.

  - path: docs/user_manual/calculations.md
    title: Calculations
    page_type: sub_page
    purpose: >
      Explain what the library can calculate and how to choose. Cover the three
      calculation types (power flow, state estimation, short circuit), regulated
      power flow with automatic tap changing, symmetric versus asymmetric
      calculations, floating grid handling, and the algorithm options for each
      calculation type, including the quick decision guide for power flow
      algorithms. Then batch calculations: batch datasets, dependent and full
      batch updates, Cartesian product of batch datasets, and parallel computing.
      Link to the algorithm pages for the mathematics and do not reproduce
      derivations. Keep code examples consistent with the current Python API.

  - path: docs/user_manual/data-validator.md
    title: Data Validator
    page_type: sub_page
    purpose: >
      Explain the input and update data validator. Input data is not validated
      automatically for performance reasons, and many data errors give invalid
      results without raising an exception, so users should validate before
      constructing a model. Cover the validation error objects and their readable
      messages, the manual validation functions, the assertion helpers and the
      utilities, all available from power_grid_model.validation. Link to the
      Validation Examples notebook.

  - path: docs/user_manual/dataset-terminology.md
    title: Dataset Terminology
    page_type: sub_page
    purpose: >
      Define the vocabulary used for the library's data structures: dataset,
      component and attribute. Cover the data structure overview, numpy array
      dimensions, dataset types, terminology related to data structures, and the
      attributes of components. Keep definitions consistent with the Native Data
      Interface and Components pages. Link to the Python API reference for the
      detailed data types.

  - path: docs/user_manual/performance-guide.md
    title: Guidelines for performance enhancement
    page_type: sub_page
    purpose: >
      System-level guidance for getting the best performance on large grids,
      batch calculations with many scenarios, and many changes per scenario. Cover
      data validity, data format (input and update volume, output volume, database
      integration), batch calculations (topology caching, batch datasets,
      multi-dimensional batches), parallel computing and matrix prefactorization.
      Algorithm-level choices belong on the Calculations page, so link there
      instead of repeating them.

  - path: docs/user_manual/model-validation.md
    title: Model validation
    page_type: sub_page
    purpose: >
      Document how the library's results are validated, using the test cases in the
      tests/data folder. Cover the minimal test cases per component validated
      against pandapower, the distribution and transmission network cases, the
      Vision validation case, the short circuit calculation cases, validation
      against other libraries, and how to create a test case. Describe only
      validation that exists in the repository. Never add validation claims that
      the test data does not support.

  - path: docs/user_manual/serialization.md
    title: Serialization
    page_type: sub_page
    purpose: >
      Explain how datasets are serialized and deserialized. Describe the two
      supported formats, JSON and msgpack, with a specification of each. Keep the
      format specifications and their examples exactly consistent with the
      library's implementation. Link to the Python API reference and the C API
      reference for the serialization tools.

  # ── Advanced documentation ─────────────────────────────────────────────────

  - path: docs/advanced_documentation/build-guide.md
    title: Build Guide
    page_type: sub_page
    purpose: >
      How to build the library from source. Cover the builds in the repository
      (the Python package with a C++ extension as calculation core, and the CMake
      project with the header-only C++ core and the dynamic library with a stable
      C API), build requirements (architecture support, compiler support, build
      dependencies), building the Python package, user and developer CMake builds,
      the build script for Linux and macOS, example setups for Ubuntu, Windows and
      macOS, and running the package tests. Commands must be copy-paste ready.
      When compiler or dependency requirements change, update them to match the
      project's build configuration.

  - path: docs/advanced_documentation/c-api.md
    title: Use Power Grid Model through C API
    page_type: sub_page
    purpose: >
      How to use the library from a non-Python application (C, C++, Java, C#, and
      others). Explain that the C API consists of header files and a dynamic
      library, link to the Build Guide, and cover finding and linking the package,
      the opaque struct and pointer, the handle, calculation options, buffers and
      attributes (component buffers and attribute buffers) and dataset views.
      Names and signatures must match the headers in the C API include folder.

  - path: docs/advanced_documentation/core-design.md
    title: Design of the Power Grid Model core
    page_type: sub_page
    purpose: >
      Describe the design of the C++ core. The core is a header-only C++ interface
      library wrapped by a dynamic C API library, built around the MainModel, which
      consists of an API part, a dispatch part, the grid model and the calculation
      logic. Cover the calculation logic and data flow between modules and the more
      detailed core design. Keep module names consistent with the source code.

  - path: docs/advanced_documentation/high-level-design.md
    title: High-level design
    page_type: sub_page
    purpose: >
      Explain the high-level architecture: a dynamic or shared library with a strict
      system boundary between the user interface and the core implementation.
      Cover the layers of abstraction, the existing library interfaces, and how to
      create, host and contribute a custom library or interface on top of the C API.

  - path: docs/advanced_documentation/native-data-interface.md
    title: Native Data Interface
    page_type: sub_page
    purpose: >
      Explain the data format used to exchange data between Python and the C++
      core: a dictionary of numpy structured arrays, keyed by component type, where
      each array element is one physical component. Cover the structured (row
      based) array, the columnar data format, creating a dataset, basic data types
      including enumerations, and the meta-data helper module. Keep code examples
      runnable against the current Python API.

  - path: docs/advanced_documentation/python-wrapper-design.md
    title: Design of the Python Wrapper Package
    page_type: sub_page
    purpose: >
      Show the structure of the power_grid_model Python package through its class
      diagram and package diagram. Only classes that have connections to other
      classes appear in the class diagram. Keep both diagrams in sync with the
      current package structure. The page is intentionally short.

  - path: docs/advanced_documentation/terminology.md
    title: Advanced terminology
    page_type: sub_page
    purpose: >
      A glossary that eases communication between the electrical engineering,
      mathematics and programming fields involved in the project. It currently
      holds programming terminology such as bug, bad input, edge case and
      undefined behavior. Keep existing definitions. Add or change a term only
      when a release introduces new vocabulary that the other documentation uses.

  # ── Contributor tooling ────────────────────────────────────────────────────

  - path: docs/working_with_containers/container-setup.md
    title: Container Setup Guide
    page_type: sub_page
    purpose: >
      How to use the provided container setup to contribute to the Python side of
      power-grid-model. Cover setup requirements (Podman or Docker with DevPod),
      the recommended setup process (cloning the repository, Podman and DevPod
      setup, Docker and DevPod setup), solutions to common setup issues and
      support for Apple Container. Commands must be copy-paste ready.
